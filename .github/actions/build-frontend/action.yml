name: Build frontend theme
description: Clone komari-web, build the default theme, and optionally upload it as an artifact.

inputs:
  node-version:
    description: Node.js version used to build komari-web.
    default: "23"
  repository:
    description: komari-web repository URL.
    default: https://github.com/komari-monitor/komari-web
  artifact-name:
    description: Optional artifact name for the packed frontend theme.
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Use pinned frontend theme
      shell: bash
      run: |
        set -euxo pipefail
        test -f komari/web/public/defaultTheme/dist/index.html
        test -f komari/web/public/defaultTheme/komari-theme.json
        # Keep the frontend from the official 1.2.5-fix2 image fixed in this
        # repository instead of rebuilding whatever komari-web currently has.
        OLD_AGENT_RAW_URL="https://raw.githubusercontent.com/komari-monitor/komari-agent/refs/heads/main/"
        NEW_AGENT_RAW_URL="https://raw.githubusercontent.com/ctfox66/my-tz-kori/refs/heads/master/komari-agent/"
        grep -RIl --exclude-dir=.git "$OLD_AGENT_RAW_URL" komari/web/public/defaultTheme \
          | xargs -r sed -i "s#${OLD_AGENT_RAW_URL}#${NEW_AGENT_RAW_URL}#g"
        if [ -f komari/web/public/defaultTheme/preview.png ] && [ ! -f komari/web/public/defaultTheme/perview.png ]; then cp -f komari/web/public/defaultTheme/preview.png komari/web/public/defaultTheme/perview.png; fi
        if [ -f komari/web/public/defaultTheme/perview.png ] && [ ! -f komari/web/public/defaultTheme/preview.png ]; then cp -f komari/web/public/defaultTheme/perview.png komari/web/public/defaultTheme/preview.png; fi

    - name: Pack frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      shell: bash
      run: |
        set -euxo pipefail
        tar -czf "$RUNNER_TEMP/${{ inputs.artifact-name }}.tar.gz" -C komari/web/public/defaultTheme .

    - name: Upload frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/${{ inputs.artifact-name }}.tar.gz
