name: Restore frontend theme
description: Download a previously built frontend theme artifact and extract it into the server embed directory.

inputs:
  artifact-name:
    description: Frontend theme artifact name.
    default: komari-frontend
  target-dir:
    description: Directory the theme is extracted into (relative to the workspace).
    default: server/web/public/defaultTheme

runs:
  using: composite
  steps:
    - name: Download frontend artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/frontend-artifact

    - name: Extract frontend artifact
      shell: bash
      run: |
        set -euxo pipefail
        TARGET="${{ inputs.target-dir }}"
        mkdir -p "$TARGET"
        rm -rf "${TARGET:?}"/*
        tar -xzf "$RUNNER_TEMP/frontend-artifact/${{ inputs.artifact-name }}.tar.gz" -C "$TARGET"
        test -f "$TARGET/komari-theme.json"
        test -d "$TARGET/dist"
